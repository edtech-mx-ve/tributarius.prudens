name: ci

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy app rag llm calculators cbr evaluation jurisprudence scripts
      - run: pytest
      - run: python -m scripts.audit_github_publish
      - run: python -m scripts.validate_deployment
      - run: python -m scripts.smoke_normative_jurisprudential
